[package]
name = "mac-file-analyzer"
version = "0.1.0"
edition = "2021"
description = "Accurate, performant file size analysis tool for macOS"
license = "MIT"
repository = "https://github.com/TimYagan/mac-file-analyzer"
homepage = "https://github.com/TimYagan/mac-file-analyzer"
keywords = ["macos", "disk-usage", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "mfa"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "walk_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
